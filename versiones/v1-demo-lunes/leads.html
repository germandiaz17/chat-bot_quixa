<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leads capturados · QUIXA</title>
<style>
  :root{--navy:#1B2A5B;--naranja:#F26B3A;--tinta:#1A1F36;--gris:#5A6485;--linea:#E4E7F0;--fondo:#F6F7FB}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    background:var(--fondo);color:var(--tinta)}
  header{background:var(--navy);color:#fff;padding:17px 0}
  .wrap{max-width:1180px;margin:0 auto;padding:0 22px}
  .nav{display:flex;align-items:center;justify-content:space-between}
  .logo{font-size:21px;font-weight:800}.logo span{color:var(--naranja)}
  .nav a{color:rgba(255,255,255,.8);text-decoration:none;font-size:14px}
  h1{font-size:25px;margin:28px 0 4px}
  .sub{color:var(--gris);margin:0 0 22px;font-size:15px}
  .cols{display:grid;grid-template-columns:330px 1fr;gap:20px;align-items:start;padding-bottom:50px}
  .lista{background:#fff;border:1px solid var(--linea);border-radius:12px;overflow:hidden;max-height:74vh;overflow-y:auto}
  .item{padding:14px 16px;border-bottom:1px solid var(--linea);cursor:pointer}
  .item:hover{background:#F0F3FA}
  .item.sel{background:#EAF0FC;border-left:3px solid var(--navy)}
  .item b{display:block;font-size:14.5px}
  .item small{color:var(--gris);font-size:12.3px}
  .tag{display:inline-block;font-size:10.5px;padding:2px 8px;border-radius:99px;margin-top:6px;font-weight:600;letter-spacing:.03em}
  .t-completa{background:#DCFCE7;color:#166534}.t-parcial{background:#FEF3C7;color:#92400E}
  .t-revision_humana{background:#FEE2E2;color:#991B1B}
  .detalle{background:#fff;border:1px solid var(--linea);border-radius:12px;padding:26px;min-height:300px}
  .vacio{color:var(--gris);text-align:center;padding:70px 20px}
  .resumen{background:#F0F4FF;border-left:3px solid var(--navy);padding:15px 18px;border-radius:7px;
    font-size:14.3px;line-height:1.62;margin-bottom:22px}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  td{padding:7px 10px;border-bottom:1px solid #F0F2F7;vertical-align:top}
  td:first-child{color:var(--gris);width:220px;font-size:12.6px}
  .seccion{font-weight:700;color:var(--navy);font-size:12px;text-transform:uppercase;letter-spacing:.06em;
    padding:20px 10px 7px}
  .vacio-campo{color:#C2C8D8}
  details{margin-top:20px}summary{cursor:pointer;color:var(--navy);font-size:13.5px;font-weight:600}
  pre{background:#1A1F36;color:#D7DCE8;padding:16px;border-radius:9px;overflow:auto;font-size:11.6px;max-height:420px}
  @media(max-width:820px){.cols{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="wrap nav">
  <div class="logo">Qui<span>x</span>a</div><a href="/">← Volver al sitio</a>
</div></header>

<div class="wrap">
  <h1>Leads capturados</h1>
  <p class="sub">Registro estructurado que el consultor virtual entrega a QUIXA al cerrar cada conversación.</p>
  <div class="cols">
    <div class="lista" id="lista"><div class="vacio">Cargando…</div></div>
    <div class="detalle" id="detalle"><div class="vacio">Selecciona un lead de la lista.</div></div>
  </div>
</div>

<script>
const GRUPOS = {
  'Identificación': ['nombre_contacto','rol_contacto','tipo_interlocutor','empresa_nombre','sector_actividad','anos_operacion','rango_ventas'],
  'Diagnóstico': ['situacion_actual','reto_principal','categoria_reto','subcategorias','causa_percibida','antiguedad_reto','impacto','impacto_clasificado','acciones_previas','resultado_acciones_previas'],
  'Profundización': ['iniciativas_compitiendo','barrera_priorizacion','situacion_competitiva','propuesta_valor_percibida','dependencia_dueno','prioridad_reto'],
  'Urgencia y expectativa': ['urgencia','consecuencia_no_accion','decisores','expectativa','resultado_esperado','preferencia_acompanamiento'],
  'Orientación': ['servicio_orientado','alternativa_secundaria','motivo_orientacion','validacion_ruta','discrepancia_ruta','necesidad_ajustada','necesidad_fuera_portafolio','descripcion_necesidad_fuera_portafolio'],
  'Contacto': ['email','telefono','preferencia_contacto','autorizacion_contacto'],
  'Embajador': ['referido_tipo','referido_rol','referido_contexto','relacion_referido','interes_embajadores'],
  'Metadatos': ['fecha_hora','session_id','origen_pagina','origen_ref','estado_conversacion','nivel_completitud','observaciones','correcciones_resumen']
};
let datos = [];

function val(v){
  if (v === true) return 'sí'; if (v === false) return 'no';
  if (Array.isArray(v)) return v.length ? v.join(', ') : '';
  return v == null ? '' : String(v);
}

function pintarLista(){
  const el = document.getElementById('lista');
  if (!datos.length){ el.innerHTML = '<div class="vacio">Todavía no hay leads.<br><br>Conversa con el widget en el sitio y cierra la conversación.</div>'; return; }
  el.innerHTML = datos.map((d,i) => {
    const l = d.lead || {};
    const est = l.estado_conversacion || 'parcial';
    return `<div class="item ${i===0?'sel':''}" onclick="ver(${i},this)">
      <b>${val(l.nombre_contacto) || '(sin nombre)'}</b>
      <small>${val(l.empresa_nombre) || '—'}</small>
      <span class="tag t-${est}">${est.replace('_',' ')}</span></div>`;
  }).join('');
  ver(0);
}

function ver(i, node){
  document.querySelectorAll('.item').forEach(n=>n.classList.remove('sel'));
  (node || document.querySelectorAll('.item')[i])?.classList.add('sel');
  const l = datos[i].lead || {};
  let html = '';
  if (l.resumen_para_consultor) html += `<div class="resumen"><b>Resumen para el consultor</b><br>${l.resumen_para_consultor}</div>`;
  html += '<table>';
  for (const [grupo, campos] of Object.entries(GRUPOS)){
    const hay = campos.some(c => val(l[c]) !== '');
    if (!hay) continue;
    html += `<tr><td colspan="2" class="seccion">${grupo}</td></tr>`;
    for (const c of campos){
      const v = val(l[c]);
      html += `<tr><td>${c}</td><td>${v ? v : '<span class="vacio-campo">—</span>'}</td></tr>`;
    }
  }
  html += '</table>';
  if (l.transcripcion) html += `<details><summary>Ver transcripción</summary><pre>${l.transcripcion.replace(/</g,'&lt;')}</pre></details>`;
  html += `<details><summary>Ver JSON completo</summary><pre>${JSON.stringify(l,null,2).replace(/</g,'&lt;')}</pre></details>`;
  document.getElementById('detalle').innerHTML = html;
}

fetch('/api/leads').then(r=>r.json()).then(d=>{ datos=d; pintarLista(); })
  .catch(()=>{ document.getElementById('lista').innerHTML='<div class="vacio">No se pudo cargar.</div>'; });
</script>
</body>
</html>
