<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leads capturados · QUIXA</title>
<link rel="icon" type="image/png" href="favicon-quixa.png">
<link rel="apple-touch-icon" href="favicon-quixa.png">
<link rel="stylesheet" href="/estilos.css">
<link rel="stylesheet" href="/leads.css">
</head>
<body class="cuerpo-leads">
<header class="sitio-header"><div class="wrap nav">
  <a class="marca" href="index.html" aria-label="Ir a la página principal"><img src="Logo_quixa.png" alt="QUIXA" class="logo-img"></a>
  <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="menu" aria-label="Abrir menú"><span></span></button>
  <nav class="menu" id="menu">
    <a href="index.html">Inicio</a>
    <a href="index.html#servicios">Servicios</a>
    <a href="como-funciona.html">Cómo funciona</a>
    <a href="leads.html" aria-current="page">Leads</a>
  </nav>
</div></header>

<div class="wrap">
  <h1 class="titulo-leads">Leads capturados</h1>
  <p class="sub">Ficha que recibe el consultor de QUIXA (paso 2 del proceso) para estudiar el caso y estructurar el abordaje.</p>
  <div class="cols">
    <div class="lista" id="lista"><div class="vacio">Cargando…</div></div>
    <div class="detalle" id="detalle"><div class="vacio">Selecciona un lead de la lista.</div></div>
  </div>
</div>

<script>
const CHAT = { general:'Chat general', anticonsejo_1a1:'Anticonsejo 1:1', estrategia:'Consultoría en Estrategia',
  junta_asesora:'Junta Asesora', proyectos_consultoria:'Proyectos de Consultoría', embajadores:'Programa de Embajadores' };
const PROBLEMA = { crecimiento_sin_rumbo:'Crecimiento sin rumbo', zona_de_copia:'Zona de copia', soledad_del_dueno:'Soledad del dueño' };
const CRITERIO = { lider:'Líder', trayectoria:'Trayectoria +10 años', tamano:'Ventas 6.000–50.000 M', senales:'Señales de alerta' };
let datos = [];

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const bonito = s => esc(String(s ?? '').replace(/_/g, ' '));
function val(v){
  if (v === true) return 'sí'; if (v === false) return 'no';
  if (Array.isArray(v)) return v.map(x => typeof x === 'object' ? JSON.stringify(x) : x).join(', ');
  if (v && typeof v === 'object') return '';
  return v == null ? '' : String(v);
}
function filas(l, campos){
  return campos.filter(([c]) => val(l[c]) !== '').map(([c, et]) =>
    `<tr><td class="k">${et}</td><td>${esc(val(l[c]))}</td></tr>`).join('');
}
function lista(t, arr){ arr = (arr || []).filter(Boolean); return arr.length ? `<b>${t}</b><ul>${arr.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : ''; }

function pintarLista(){
  const el = document.getElementById('lista');
  if (!datos.length){ el.innerHTML = '<div class="vacio">Todavía no hay leads.<br><br>Conversa con el widget en el sitio y cierra la conversación.</div>'; return; }
  el.innerHTML = datos.map((d,i) => {
    const l = d.lead || {};
    const est = l.estado_conversacion || 'parcial';
    const aj = (l.ajuste_perfil || {}).nivel;
    return `<div class="item ${i===0?'sel':''}" onclick="ver(${i},this)">
      <b>${esc(l.nombre_contacto) || '(sin nombre)'}</b>
      <small>${esc(l.empresa_nombre) || '—'} · ${CHAT[l.chat_type] || 'versión anterior'}</small>
      <div class="tags"><span class="tag t-${est}">${bonito(est)}</span>
      ${aj && aj !== 'no_aplica' ? `<span class="tag t-${aj}">ajuste ${bonito(aj)}</span>` : ''}</div></div>`;
  }).join('');
  ver(0);
}

function ver(i, node){
  document.querySelectorAll('.item').forEach(n => n.classList.remove('sel'));
  (node || document.querySelectorAll('.item')[i])?.classList.add('sel');
  const l = datos[i].lead || {};
  let h = '';

  h += `<div class="cabeza"><div><h2>${esc(l.nombre_contacto) || '(sin nombre)'}</h2>
    <p>${[l.cargo_contacto || l.rol_contacto, l.empresa_nombre, l.ciudad].filter(Boolean).map(esc).join(' · ')}</p></div>
    <div class="tags">${l.chat_type ? `<span class="tag">${CHAT[l.chat_type] || bonito(l.chat_type)}</span>` : ''}
    ${l.classification ? `<span class="tag t-${l.classification}">${bonito(l.classification)}</span>` : ''}
    ${l.review_status ? `<span class="tag">revisión: ${bonito(l.review_status)}</span>` : ''}</div></div>`;

  if (l.resumen_para_consultor) h += `<div class="resumen"><b>Resumen para el consultor</b><br>${esc(l.resumen_para_consultor)}</div>`;
  const alertas = [...(l.alertas_revision || []), ...(l.alertas || [])];
  if (alertas.length) h += `<div class="alerta"><b>Revisar</b><ul>${alertas.map(a => `<li>${esc(a)}</li>`).join('')}</ul></div>`;

  if (!l.chat_type) {
    // Lead de la versión anterior (demo del 5 de octubre)
    h += '<h3>Registro (versión anterior)</h3><table>' + Object.entries(l)
      .filter(([k,v]) => !['transcripcion','resumen_para_consultor'].includes(k) && val(v) !== '')
      .map(([k,v]) => `<tr><td class="k">${esc(k)}</td><td>${esc(val(v))}</td></tr>`).join('') + '</table>';
  } else {
    const aj = l.ajuste_perfil || {};
    if (aj.aplica) {
      h += `<h3>Ajuste al perfil de cliente ideal · <span class="tag t-${aj.nivel}">${bonito(aj.nivel)}</span> ${aj.puntaje ?? ''}/${aj.maximo ?? 8}</h3><div class="crit">` +
        Object.entries(aj.criterios || {}).map(([k,v]) => `<div><b>${CRITERIO[k] || k}</b><span class="${v}">${bonito(v)}</span></div>`).join('') + '</div>';
    }
    h += '<h3>Perfilamiento QUIXA</h3><table>';
    h += (l.problemas_quixa || []).length ? `<tr><td class="k">Problemas de fondo</td><td>${l.problemas_quixa.map(p => PROBLEMA[p] || bonito(p)).join(', ')}</td></tr>` : '';
    h += filas(l, [['frenos_detectados','Frenos detectados'],['senales_alerta_icp','Señales de alerta'],['servicio_orientado','Servicio orientado'],
      ['motivo_orientacion','Motivo de la orientación'],['ruta_posterior_probable','Ruta posterior probable'],['ruta_posterior_razon','Por qué'],
      ['classification_reason','Justificación de la clasificación']]);
    h += '</table>';

    const pc = l.preparacion_consultor || {};
    const prep = lista('Hipótesis iniciales (interpretación de la IA)', pc.hipotesis_iniciales) + lista('Datos a investigar', pc.datos_a_investigar) +
      lista('Preguntas para la sesión', pc.preguntas_para_la_sesion) + lista('Supuestos a cuestionar', pc.supuestos_a_cuestionar);
    if (prep) h += `<h3>Preparación del consultor</h3><div class="prep">${prep}</div>`;

    const rf = l.referido || {};
    if (Object.values(rf).some(v => v)) h += '<h3>Empresa referida</h3><table>' +
      Object.entries(rf).filter(([,v]) => v).map(([k,v]) => `<tr><td class="k">${bonito(k)}</td><td>${esc(v)}</td></tr>`).join('') + '</table>';

    h += '<h3>Contacto y empresa</h3><table>' + filas(l, [['cargo_contacto','Cargo'],['rol_lider','Rol de decisión'],['empresa_nombre','Empresa'],
      ['actividad_empresa','Actividad'],['sector','Sector'],['anos_operacion','Años de operación'],['etapa_empresa','Etapa'],['rango_ventas','Ventas anuales (COP M)'],
      ['ciudad','Ciudad'],['pais','País'],['email','Correo'],['telefono','Teléfono'],['autorizacion_datos','Autorización de datos'],
      ['plazo_avance','Plazo para avanzar'],['urgencia','Urgencia'],['informacion_adicional','Información adicional'],['correcciones_prospecto','Correcciones']]) + '</table>';

    const re = l.resultado_especializado || {};
    if (Object.keys(re).length) h += `<h3>Resultado del chat · ${CHAT[l.chat_type] || ''}</h3><table>` +
      Object.entries(re).filter(([,v]) => val(v)).map(([k,v]) => `<tr><td class="k">${bonito(k)}</td><td>${esc(val(v))}</td></tr>`).join('') + '</table>';

    if ((l.respuestas || []).length) {
      h += '<h3>Respuestas literales</h3><table><tr><th>Código</th><th>Pregunta y respuesta del prospecto</th><th>Evidencia</th></tr>';
      for (const r of l.respuestas) {
        h += `<tr><td><b>${esc(r.question_id)}</b></td><td><div class="q">${esc(r.question_text)}</div><div class="lit">«${esc(r.answer_raw)}»</div>` +
          (r.follow_ups || []).map(f => `<div class="fu">${esc(f.question_text)}<br>«${esc(f.answer_raw)}»</div>`).join('') +
          (r.answer_summary ? `<div class="q" style="margin-top:4px">Resumen IA: ${esc(r.answer_summary)}</div>` : '') +
          `</td><td>${r.evidence_type ? `<span class="ev ev-${r.evidence_type}">${bonito(r.evidence_type)}</span>` : ''}</td></tr>`;
      }
      h += '</table>';
    }
    if ((l.datos_pendientes || []).length) h += `<h3>Datos pendientes</h3><div class="prep"><ul>${l.datos_pendientes.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>`;

    const ri = l.referencia_inversion_interna;
    if (ri) h += '<h3>Referencia interna de inversión (no se muestra al prospecto)</h3><table>' +
      Object.entries(ri).map(([k,v]) => `<tr><td class="k">${bonito(k)}</td><td>${esc(v)}</td></tr>`).join('') + '</table>';
  }

  if (l.transcripcion) h += `<details><summary>Ver transcripción</summary><pre>${esc(l.transcripcion)}</pre></details>`;
  h += `<details><summary>Ver JSON completo</summary><pre>${esc(JSON.stringify(l, null, 2))}</pre></details>`;
  document.getElementById('detalle').innerHTML = h;
}

fetch('/api/leads').then(r => r.json()).then(d => { datos = d; pintarLista(); })
  .catch(() => { document.getElementById('lista').innerHTML = '<div class="vacio">No se pudo cargar. Abre esta página desde el servidor de la demo.</div>'; });
</script>
<script src="/sitio.js"></script>
</body>
</html>
