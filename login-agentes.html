<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso agentes - QUIXA</title>
    <link rel="icon" type="image/png" href="favicon-quixa.png">
    <link rel="apple-touch-icon" href="favicon-quixa.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="estilos.css">
    <link rel="stylesheet" href="login-agentes.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-container">
            <div class="header-left">
                <a href="index.html" class="logo-group" aria-label="Ir a la página principal">
                    <img src="Logo_quixa.png" alt="QUIXA" class="logo-img">
                </a>
                <div class="header-separator"></div>
                <div class="header-slogan">
                    <div>Estrategia · Procesos · Personas</div>
                    <div>para un crecimiento sostenible</div>
                </div>
            </div>

            <nav class="nav">
                <a href="index.html" class="nav-link">Inicio</a>
                <a href="index.html#servicios" class="nav-link">Servicios</a>
                <a href="como-funciona.html" class="nav-link">Cómo funciona</a>
            </nav>

            <a href="login-agentes.html" class="header-btn" aria-current="page">
                <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="9" cy="6.5" r="3" stroke="white" stroke-width="1.5"/>
                    <path d="M3.5 15C3.5 12.5 5.7 10.5 9 10.5C12.3 10.5 14.5 12.5 14.5 15" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
                </svg>
                <span>Soy Agente Quixa</span>
            </a>
        </div>
    </header>

    <!-- Login -->
    <main class="login-main">
        <section class="login-card" aria-labelledby="login-title">
            <div class="login-badge" aria-hidden="true">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="4.5" y="10" width="15" height="10" rx="2.5" stroke="#4A2C9B" stroke-width="1.6"/>
                    <path d="M8 10V7.5C8 5.29 9.79 3.5 12 3.5C14.21 3.5 16 5.29 16 7.5V10" stroke="#4A2C9B" stroke-width="1.6" stroke-linecap="round"/>
                    <circle cx="12" cy="15" r="1.5" fill="#4A2C9B"/>
                </svg>
            </div>

            <h1 class="login-title" id="login-title">Acceso para agentes</h1>
            <p class="login-subtitle">Inicia sesión con tus credenciales corporativas de QUIXA.</p>

            <form class="login-form" id="loginForm" novalidate>
                <div class="form-field">
                    <label class="form-label" for="email">Correo corporativo</label>
                    <input class="form-input" type="email" id="email" name="email" placeholder="nombre@quixa.com" autocomplete="username" required>
                </div>

                <div class="form-field">
                    <label class="form-label" for="password">Contraseña</label>
                    <div class="password-wrap">
                        <input class="form-input" type="password" id="password" name="password" placeholder="Tu contraseña" autocomplete="current-password" required>
                        <button type="button" class="password-toggle" id="passwordToggle" aria-label="Mostrar contraseña" aria-pressed="false">
                            <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                                <path d="M1.75 10C3.25 6.5 6.25 4.25 10 4.25C13.75 4.25 16.75 6.5 18.25 10C16.75 13.5 13.75 15.75 10 15.75C6.25 15.75 3.25 13.5 1.75 10Z" stroke="#5B5675" stroke-width="1.5" stroke-linejoin="round"/>
                                <circle cx="10" cy="10" r="2.75" stroke="#5B5675" stroke-width="1.5"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="form-row">
                    <label class="form-check">
                        <input type="checkbox" id="remember" name="remember">
                        <span>Recordarme</span>
                    </label>
                    <a href="#" class="form-link">¿Olvidaste tu contraseña?</a>
                </div>

                <p class="login-message" id="loginMessage" role="alert" aria-live="polite"></p>

                <button type="submit" class="login-submit">
                    <span>Iniciar sesión</span>
                    <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                        <path d="M7 5L11 9L7 13" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
            </form>

            <p class="login-footnote">¿No eres agente de QUIXA? <a href="index.html">Volver al sitio</a></p>
        </section>
    </main>

    <script>
        const form = document.getElementById('loginForm');
        const message = document.getElementById('loginMessage');
        const password = document.getElementById('password');
        const passwordToggle = document.getElementById('passwordToggle');

        passwordToggle.addEventListener('click', () => {
            const show = password.type === 'password';
            password.type = show ? 'text' : 'password';
            passwordToggle.setAttribute('aria-pressed', String(show));
            passwordToggle.setAttribute('aria-label', show ? 'Ocultar contraseña' : 'Mostrar contraseña');
        });

        form.addEventListener('submit', (event) => {
            event.preventDefault();
            message.className = 'login-message';
            message.textContent = '';

            if (!form.checkValidity()) {
                message.classList.add('is-error');
                message.textContent = 'Completa tu correo corporativo y tu contraseña para continuar.';
                form.reportValidity();
                return;
            }

            message.classList.add('is-info');
            message.textContent = 'El servicio de autenticación de agentes todavía no está conectado.';
        });
    </script>
</body>
</html>
