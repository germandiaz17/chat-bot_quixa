# Despliegue del Consultor Virtual QUIXA en un VPS (MVP).
# Uso: copiar .env.ejemplo a .env, completarlo y ejecutar `docker compose up -d`.
# Guía completa en despliegue/LEEME.md

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD}
      POSTGRES_DB: n8n
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 10s
      timeout: 5s
      retries: 10

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.41.6
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # El editor de n8n NO queda expuesto a internet: solo en el propio servidor.
    # Para entrar desde tu computador: ssh -L 5678:localhost:5678 usuario@servidor
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?falta N8N_ENCRYPTION_KEY}
      N8N_HOST: ${DOMINIO_BOT:?falta DOMINIO_BOT}
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://${DOMINIO_BOT}/
      N8N_PROXY_HOPS: "1"
      GENERIC_TIMEZONE: America/Bogota
      TZ: America/Bogota
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_RUNNERS_ENABLED: "true"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      N8N_RESTRICT_FILE_ACCESS_TO: /data/leads
      N8N_BLOCK_FILE_ACCESS_TO_N8N_FILES: "true"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "720"
      # Reglas del consultor virtual (leídas por los nodos de código)
      QUIXA_ORIGENES: ${QUIXA_ORIGENES:?falta QUIXA_ORIGENES}
      QUIXA_MAX_MENSAJES_SESION: ${QUIXA_MAX_MENSAJES_SESION:-30}
      QUIXA_MAX_CARACTERES: ${QUIXA_MAX_CARACTERES:-1000}
      QUIXA_MAX_MENSAJES_IP_HORA: ${QUIXA_MAX_MENSAJES_IP_HORA:-120}
      QUIXA_MINUTOS_INACTIVIDAD: ${QUIXA_MINUTOS_INACTIVIDAD:-30}
      QUIXA_CORREO_CONSULTOR: ${QUIXA_CORREO_CONSULTOR:-}
      QUIXA_URL_VISOR: ${QUIXA_URL_VISOR:-}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./datos/leads:/data/leads

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      - n8n
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMINIO_BOT: ${DOMINIO_BOT}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../widget:/srv/widget:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  n8n_data:
  caddy_data:
  caddy_config:
